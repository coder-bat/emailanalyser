services:
  emailanalyser:
    build: .
    # Map host port (override with HOST_API_PORT env var, default 5000)
    ports:
      - "${HOST_API_PORT:-5000}:5000"
    environment:
      - API_PORT=5000
      - OUTPUT_DIR=/app/email_analysis_output
      - FLASK_ENV=production
      - MAX_JOBS=50
      - JOB_TTL_SECONDS=1800  # 30 minutes TTL for completed jobs
      - CACHE_TTL=60
    volumes:
      - email_data:/app/email_analysis_output
    restart: unless-stopped
    # Security hardening
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    user: "1000:1000"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

volumes:
  email_data:
    driver: local